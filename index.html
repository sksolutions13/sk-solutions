<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SK Solutions | Websites, Apps and AI/ML Development</title>
    <meta name="description" content="SK Solutions builds websites and mobile/web apps, trains custom AI/ML models, and delivers end-to-end projects and training modules." />
    <meta name="theme-color" content="#07070f" />
    <meta property="og:title" content="SK Solutions" />
    <meta property="og:description" content="We build, train, and ship intelligent digital products." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicons/favicon-plasma.png" id="favicon-link" />
    <link rel="apple-touch-icon" href="/favicons/favicon-plasma.png" id="apple-touch-icon" />
    <script>
      (function() {
        try {
          var validThemes = ['plasma', 'aurora', 'nebula', 'ember', 'fusion', 'daylight'];
          var saved = localStorage.getItem('sk-theme') || 'plasma';
          if (validThemes.indexOf(saved) === -1) saved = 'plasma';
          var fav = document.getElementById('favicon-link');
          if (fav) fav.href = '/favicons/favicon-' + saved + '.png';
          var appleFav = document.getElementById('apple-touch-icon');
          if (appleFav) appleFav.href = '/favicons/favicon-' + saved + '.png';
          document.documentElement.dataset.theme = saved;
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
